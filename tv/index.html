<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181B">
  <title>Экран на ТВ — подключение</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../apps/phone-to-tv/icon.png">
  <style>
    :root { --bg: #16181B; --card: #1F2226; --line: #3A3F46; --text: #D8D4C8; --dim: #7C838C; --accent: #FF8A3D; --ink: #1A1208; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); padding: 26px 22px; text-align: center; }
    img.icon { width: 72px; height: 72px; image-rendering: pixelated; border: 3px solid #0d0e10; }
    h1 { margin: 14px 0 6px; font-size: 22px; color: #F1EDE2; }
    p { margin: 0 0 14px; }
    .tv { font: 600 18px ui-monospace, "Courier New", monospace; color: var(--accent); }
    .btn { display: block; width: 100%; margin: 10px 0 0; padding: 14px 16px; background: var(--accent); color: var(--ink);
      font: 600 17px system-ui, sans-serif; text-decoration: none; border: 0; }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
    .hint { font-size: 13px; color: var(--dim); margin-top: 16px; }
    .err { color: #ffb36b; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="../apps/phone-to-tv/icon.png" alt="">
    <h1>Экран на ТВ</h1>
    <p id="what">Подключение к приставке</p>
    <p class="tv" id="tv"></p>
    <a class="btn" id="open" href="#">Подключиться</a>
    <a class="btn ghost" href="../#phone-to-tv">Скачать приложение</a>
    <p class="hint">Если ничего не происходит — установите «Экран на ТВ» на телефон и отсканируйте QR-код с экрана приставки ещё раз.</p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var h = q.get('h') || '', p = q.get('p') || '', n = q.get('n') || '';
      var ok = /^[0-9a-fA-F.:]{3,45}$/.test(h);
      var tv = document.getElementById('tv'), open = document.getElementById('open');
      if (!ok) {
        document.getElementById('what').innerHTML = '<span class="err">В ссылке нет адреса приставки.</span>';
        open.style.display = 'none';
        return;
      }
      tv.textContent = (n ? n + ' · ' : '') + h;
      var data = 'h=' + encodeURIComponent(h) + (p ? '&p=' + encodeURIComponent(p) : '') + (n ? '&n=' + encodeURIComponent(n) : '');
      var fallback = encodeURIComponent(new URL('../#phone-to-tv', location.href).href);
      var intent = 'intent://connect?' + data + '#Intent;scheme=ptv;package=com.example.phonetotv;S.browser_fallback_url=' + fallback + ';end';
      var isAndroid = /Android/i.test(navigator.userAgent);
      open.href = isAndroid ? intent : 'ptv://connect?' + data;
      // Сразу пробуем открыть приложение; если браузер не разрешит без нажатия — останется кнопка.
      if (isAndroid) setTimeout(function () { location.href = intent; }, 150);
    })();
  </script>
</body>
</html>
